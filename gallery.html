<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperStar Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Banner Image Styling */
        .gallery-banner-img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
        }

        .gallery-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        .gallery-img:hover {
            transform: scale(1.03);
        }

        .gallery-section {
            border: 1px solid #000;
            padding: 30px;
            margin-top: -50px;
            background-color: white;
            position: relative;
            z-index: 2;
        }

        .nav-pills .nav-link {
            border-radius: 50px;
            padding: 10px 30px;
            margin: 5px;
            background-color: #c4c4c4;
            border: none;
            color: #000;
        }

        .nav-pills .nav-link.active {
            background-color: #0d6efd;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">SuperStar Restaurant</a>
                <div class="navbar-nav">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="about.html">About us</a>
                    <a class="nav-link" href="menu.html">Menu</a>
                    <a class="nav-link active" href="gallery.html">Gallery</a>
                    <a class="nav-link" href="contact.html">Contact us</a>
                </div>
            </div>
        </nav>
    </header>

    <section class="container-fluid p-0">
        <img src="gallery-banner.jpg" alt="Our Restaurant Gallery" class="gallery-banner-img">
    </section>

    <main class="container mb-5">
        <div class="gallery-section shadow-sm">
            <h2 class="text-center mb-4">Our Gallery</h2>
            
            <ul class="nav nav-pills justify-content-center mb-5" id="galleryTabs" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active" id="all-tab" data-bs-toggle="pill" data-bs-target="#all" type="button" role="tab">ALL</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="food-tab" data-bs-toggle="pill" data-bs-target="#food" type="button" role="tab">Food</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="interior-tab" data-bs-toggle="pill" data-bs-target="#interior" type="button" role="tab">Interior</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="event-tab" data-bs-toggle="pill" data-bs-target="#events" type="button" role="tab">Event</button>
                </li>
            </ul>

            <div class="tab-content" id="galleryTabsContent">
                
                <div class="tab-pane fade show active" id="all" role="tabpanel">
                    <div class="row g-3">
                        <div class="col-md-4"><img src="classiccombo.jpg" class="gallery-img" alt="Food"></div>
                        <div class="col-md-4"><img src="interior.avif" class="gallery-img" alt="Interior"></div>
                        <div class="col-md-4"><img src="event.jpg" class="gallery-img" alt="Event"></div>
                        <div class="col-md-4"><img src="burger2.jpg" class="gallery-img" alt="Food"></div>
                        <div class="col-md-4"><img src="interior2.jpg" class="gallery-img" alt="Interior"></div>
                        <div class="col-md-4"><img src="team.jpg" class="gallery-img" alt="Team"></div>
                    </div>
                </div>

                <div class="tab-pane fade" id="food" role="tabpanel">
                    <div class="row g-3">
                        <div class="col-md-4"><img src="breakfastcombo.jpg" class="gallery-img" alt="Food"></div>
                        <div class="col-md-4"><img src="classiccombo.jpg" class="gallery-img" alt="Food"></div>
                        <div class="col-md-4"><img src="doubletrouble.jpg" class="gallery-img" alt="Food"></div>
                        <div class="col-md-4"><img src="loadedfries.avif" class="gallery-img" alt="Food"></div>
                    </div>
                </div>

                <div class="tab-pane fade" id="interior" role="tabpanel">
                    <div class="row g-3">
                        <div class="col-md-4"><img src="interior.avif" class="gallery-img" alt="Interior"></div>
                        <div class="col-md-4"><img src="interior2.jpg" class="gallery-img" alt="Interior"></div>
                    </div>
                </div>

                <div class="tab-pane fade" id="events" role="tabpanel">
                    <div class="row g-3">
                        <div class="col-md-4"><img src="event.jpg" class="gallery-img" alt="Event"></div>
                        <div class="col-md-4"><img src="evnt2.avif" class="gallery-img" alt="Event"></div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="text-center py-3 bg-dark text-white">
        <p class="mb-0">Copyright &copy; 2026 Super Star Restaurant. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
