<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperStar Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .banner-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background-color: #777;
        }
        .contact-container {
            border: 1px solid #000;
            padding: 40px;
            background-color: #fff;
        }
        .location-box {
            border: 1px solid #ccc;
            padding: 20px;
            height: 100%;
        }
        .form-control, .form-select {
            background-color: #e9ecef; /* Light gray from wireframe */
            border: none;
            border-radius: 8px;
            padding: 12px;
        }
        .btn-send {
            background-color: #777;
            color: white;
            border-radius: 20px;
            padding: 10px 30px;
            float: right;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">SuperStar</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="about.html">About us</a>
                <a class="nav-link" href="menu.html">Menu</a>
                <a class="nav-link" href="gallery.html">Gallery</a>
                <a class="nav-link active" href="contact.html">Contact us</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid p-0 mb-5">
        <img src="image/contact-banner.jpg" alt="Contact Us Banner" class="banner-img">
    </div>

    <main class="container mb-5">
        <div class="contact-container shadow-sm">
            
            <div class="row mb-5">
                <div class="col-md-6">
                    <div class="location-box">
                        <h4 class="fw-bold">Contact Information</h4>
                        <p class="mt-4"><strong>Address:</strong> Plot 2770, Oasis Mall, Gaborone</p>
                        <p><strong>Phone:</strong> +267 76 211 541</p>
                        <p><strong>Email:</strong> gosegokajane@gmail.com</p>
                        <p><strong>Hours:</strong> Mon - Sat: 7AM - 9PM</p>
                    </div>
                </div>
                <div class="col-md-6">
                    <img src="image/location.jpg" class="img-fluid rounded w-100 h-100" style="object-fit:cover;" alt="Location Map">
                </div>
            </div>

            <h3 class="text-center mb-4 fw-bold">Feedback/ Contact Form</h3>
            <form action="mailto:gosegokajane@gmail.com" method="post" enctype="text/plain">
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="fullname" placeholder="Enter your full name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" name="phone" placeholder="Enter your phone number">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Subject</label>
                        <input type="text" class="form-control" name="subject" placeholder="Enter subject" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label d-block">Type of Enquiry:</label>
                    <div class="d-flex gap-4">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="enquiry" value="general" checked>
                            <label class="form-check-label">General</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="enquiry" value="order">
                            <label class="form-check-label">Order Issue</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="enquiry" value="feedback">
                            <label class="form-check-label">Feedback</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="enquiry" value="reservation">
                            <label class="form-check-label">Reservation</label>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Type your message here..</label>
                    <textarea class="form-control" name="message" rows="5" required></textarea>
                </div>

                <div class="overflow-hidden">
                    <button type="submit" class="btn btn-send">Send Message</button>
                </div>
            </form>
        </div>
    </main>

   <footer class="text-center py-3 bg-dark text-white">
    <div class="container">
        <p class="mb-0">Copyright &copy; 2026 Super Star Restaurant. All Rights Reserved.</p>
    </div>
</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
